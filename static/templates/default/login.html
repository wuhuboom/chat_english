<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="cn">
<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>{{.SystemTitle}}</title>
    <meta name="keywords" content="{{.SystemKeywords}}" />
    <meta name="description" content="{{.SystemDesc}}" />
    <link rel="stylesheet" href="/static/element-ui/2.15.1/theme-chalk/index.min.css">
    <link rel="stylesheet" href="/static/css/admin-modern.css?v=1.4.0">
    <script src="/static/vue/2.6.11/vue.min.js"></script>
	<script src="/static/element-ui/2.15.1/index.js"></script>
	<script src="/static/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="/static/css/login-modern.css?v=1.0.1">
    <link rel="icon" href="/static/images/logo.png">
</head>
<body class="adminLogin">
<div id="app" class="loginShell">
    <template>
        <div class="loginLayout">
            <aside class="loginBrandPanel">
                <div class="loginBrandGlow loginBrandGlowOne"></div>
                <div class="loginBrandGlow loginBrandGlowTwo"></div>
                <div class="loginBrandContent">
                    <div class="loginBrandMark">
                        <span class="loginBrandLogoIcon"><i class="el-icon-chat-dot-round"></i></span>
                        <span>{{.SystemTitle}}</span>
                    </div>
                    <div class="loginBrandMain">
                        <div class="loginBrandEyebrow">CUSTOMER SERVICE HUB</div>
                        <h1>让每一次客户咨询<br>都得到及时回应</h1>
                        <p>统一管理访客、会话与客服状态，为团队提供稳定、清晰、高效的服务工作台。</p>
                        <div class="loginFeatureList">
                            <div class="loginFeatureItem">
                                <span><i class="el-icon-chat-dot-round"></i></span>
                                <div>
                                    <strong>实时会话</strong>
                                    <small>访客消息即时送达，不错过重要咨询</small>
                                </div>
                            </div>
                            <div class="loginFeatureItem">
                                <span><i class="el-icon-s-custom"></i></span>
                                <div>
                                    <strong>团队协作</strong>
                                    <small>清晰掌握客服状态与当前接待情况</small>
                                </div>
                            </div>
                            <div class="loginFeatureItem">
                                <span><i class="el-icon-data-analysis"></i></span>
                                <div>
                                    <strong>服务洞察</strong>
                                    <small>从数据中持续优化客户服务质量</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="loginBrandFoot">
                        <span class="loginStatusDot"></span>
                        服务系统运行中
                    </div>
                </div>
            </aside>

            <main class="loginFormPanel">
                <div class="loginCard">
                    <div class="loginMobileBrand">
                        <span class="loginBrandLogoIcon"><i class="el-icon-chat-dot-round"></i></span>
                        <span>{{.SystemTitle}}</span>
                    </div>

                    <div class="loginHtml" v-show="!showRegHtml">
                        <div class="loginCardHead">
                            <span class="loginCardEyebrow">客服工作台</span>
                            <h1 class="loginTitle">{{.SystemLoginTitle}}</h1>
                            <p>欢迎回来，请使用您的客服账号登录。</p>
                        </div>
                        <el-form class="loginForm" :model="kefuForm" :rules="rules" ref="kefuForm">
                            <label class="loginFieldLabel">账号</label>
                            <el-form-item prop="username">
                                <el-input v-model="kefuForm.username" autocomplete="username" placeholder="请输入用户名">
                                    <i slot="prefix" class="el-icon-user"></i>
                                </el-input>
                            </el-form-item>
                            <label class="loginFieldLabel">密码</label>
                            <el-form-item prop="password">
                                <el-input type="password" show-password autocomplete="current-password"
                                    v-on:keyup.enter.native="kefuLogin('kefuForm')" v-model="kefuForm.password"
                                    placeholder="请输入密码">
                                    <i slot="prefix" class="el-icon-lock"></i>
                                </el-input>
                            </el-form-item>
                            {{if .GoogleAuthenticatorEnabled}}
                            <div v-if="googleBinding.qr_code" class="googleBindPanel">
                                <div class="googleBindTitle">
                                    <span>首次登录：请使用自己的 Google Authenticator 扫码绑定</span>
                                    <el-button type="text" icon="el-icon-question" @click="googleTutorialVisible=true">使用教程</el-button>
                                </div>
                                <img :src="googleBinding.qr_code" alt="个人谷歌验证器绑定二维码" class="googleBindQr">
                                <p class="googleBindSecret">手动密钥：<{googleBinding.secret}></p>
                                <p class="googleBindTip">绑定二维码10分钟有效，请勿分享。</p>
                            </div>
<label class="loginFieldLabel">谷歌验证码（未绑定时先提交账号密码）</label>
                            <el-form-item prop="googleCode">
                                <el-input maxlength="6" inputmode="numeric" autocomplete="one-time-code"
                                    v-on:keyup.enter.native="kefuLogin('kefuForm')" v-model="kefuForm.googleCode"
                                    placeholder="请输入 Google Authenticator 的 6 位动态码">
                                    <i slot="prefix" class="el-icon-key"></i>
                                </el-input>
                            </el-form-item>
                            {{end}}
                            <el-form-item class="loginSubmitItem">
                                <el-button class="loginSubmitButton" :loading="loading" type="primary"
                                    @click="kefuLogin('kefuForm')">
                                    登录工作台
                                    <i class="el-icon-right el-icon--right"></i>
                                </el-button>
                            </el-form-item>
                        </el-form>
                        <div class="loginActions">
                            <span class="loginSecurity"><i class="el-icon-lock"></i> 安全加密登录</span>
                            {{if .isRegister}}
                            <a @click="showRegHtml=true" class="regBtn">创建新账户</a>
                            {{end}}
                        </div>
                    </div>

                    {{if .isRegister}}
                    <div class="regHtml" v-show="showRegHtml">
                        <button type="button" class="loginBackButton" @click="showRegHtml=false">
                            <i class="el-icon-arrow-left"></i>
                            返回登录
                        </button>
                        <div class="loginCardHead">
                            <span class="loginCardEyebrow">创建账号</span>
                            <h1 class="loginTitle">加入客服团队</h1>
                            <p>填写以下信息，创建您的客服工作台账户。</p>
                        </div>
                        <el-form class="loginForm loginRegisterForm" :model="regUserForm" :rules="registerRules"
                            ref="regUserFormName">
                            <el-form-item prop="username">
                                <el-input v-model="regUserForm.username" placeholder="用户名">
                                    <i slot="prefix" class="el-icon-user"></i>
                                </el-input>
                            </el-form-item>
                            <el-form-item prop="email" style="display:none">
                                <el-input v-model="regUserForm.email" placeholder="邮箱"></el-input>
                            </el-form-item>
                            <el-form-item prop="emailCode" style="display:none">
                                <el-input v-model="regUserForm.emailCode" placeholder="邮箱验证码"></el-input>
                            </el-form-item>
                            <el-form-item prop="nickname">
                                <el-input v-model="regUserForm.nickname" placeholder="显示名称">
                                    <i slot="prefix" class="el-icon-postcard"></i>
                                </el-input>
                            </el-form-item>
                            <el-form-item prop="password">
                                <el-input type="password" show-password v-model="regUserForm.password" placeholder="密码">
                                    <i slot="prefix" class="el-icon-lock"></i>
                                </el-input>
                            </el-form-item>
                            <el-form-item prop="rePassword">
                                <el-input type="password" show-password v-model="regUserForm.rePassword"
                                    placeholder="确认密码">
                                    <i slot="prefix" class="el-icon-circle-check"></i>
                                </el-input>
                            </el-form-item>
                            <el-form-item prop="captcha" class="loginCaptchaItem">
                                <el-input v-model="regUserForm.captcha" placeholder="验证码"></el-input>
                                <img :src="codeSrc" alt="验证码" title="点击刷新"
                                    @click="codeSrc='/captcha?t='+Math.random()">
                            </el-form-item>
                            <el-form-item class="loginSubmitItem">
                                <el-button class="loginSubmitButton" :loading="loading" type="primary"
                                    @click="register()">创建账户</el-button>
                            </el-form-item>
                        </el-form>
                    </div>
                    {{end}}

                    <div class="loginNotice">{{.SystemNotice}}</div>
                    <p class="copyright">{{.CopyrightTxt}}</p>
                </div>
            </main>
        <el-dialog title="Google Authenticator 使用教程" :visible.sync="googleTutorialVisible"
            width="560px" custom-class="googleTutorialDialog">
            <el-tabs v-model="googleTutorialPlatform" stretch>
                <el-tab-pane label="Android 安卓" name="android">
                    <div class="googleTutorialContent">
                        <h3>安卓手机绑定步骤</h3>
                        <ol>
                            <li>在可信应用商店搜索并安装“Google Authenticator（谷歌身份验证器）”。</li>
                            <li>打开应用，点击右下角“+”，选择“扫描二维码”。</li>
                            <li>扫描登录页显示的二维码；无法扫码时，选择“输入设置密钥”并填写页面上的手动密钥。</li>
                            <li>应用会生成每30秒更新一次的6位动态码，把当前动态码填入登录页后再次登录。</li>
                        </ol>
                    </div>
                </el-tab-pane>
                <el-tab-pane label="iPhone / iOS" name="ios">
                    <div class="googleTutorialContent">
                        <h3>iPhone 绑定步骤</h3>
                        <ol>
                            <li>打开 App Store，搜索并安装“Google Authenticator”。</li>
                            <li>打开应用，点击“+”，选择“扫描二维码”。</li>
                            <li>扫描登录页显示的二维码；无法扫码时，选择“输入设置密钥”并填写页面上的手动密钥。</li>
                            <li>将应用中显示的6位动态码填入登录页，然后再次点击登录。</li>
                        </ol>
                    </div>
                </el-tab-pane>
            </el-tabs>
            <div class="googleTutorialWarning">
                <i class="el-icon-warning-outline"></i>
                请勿截图、转发二维码或手动密钥。更换或丢失手机时，请联系超级管理员重置绑定。
            </div>
            <span slot="footer">
                <el-button type="primary" @click="googleTutorialVisible=false">我知道了</el-button>
            </span>
        </el-dialog>
        </div>
    </template>
</div>
</body>
<script>
	new Vue({
		el: '#app',
        delimiters:["<{","}>"],
		data: {
            window:window,
            activeName:"second",
			loading:false,
            localAuth:{
                username:'',
                password:'',
            },
            ruleForm:{
                server:'',
                email:'',
                password:'',
            },
            kefuForm:{
                username:'',
                password:'',
                googleCode:'',
            },
            googleBinding:{qr_code:"",secret:""},
            googleTutorialVisible:false,
            googleTutorialPlatform:"android",
            rules: {
                username: [
                    { required: true, message: '用户名不能为空', trigger: 'blur' },
                ],
                password: [
                    { required: true, message: '密码不能为空', trigger: 'blur' },
                ],
                {{if .GoogleAuthenticatorEnabled}}
                googleCode: [
                    { pattern: /^\d{6}$/, message: '请输入6位数字动态码', trigger: 'blur' },
                ],
                {{end}}
            },
            registerRules: {
                username: [
                    { required: true, message: '用户名不能为空', trigger: 'blur' },
                    { validator: function (rule,value,callback){
                            let reg= /^[0-9A-Za-z]{4,20}$/
                            if(!reg.test(value)){callback(new Error('必须是由4-20位字母或数字组合'))
                            }else{
                                callback()
                            }
                        },trigger: 'blur'},
                ],
                password: [
                    { required: true, message: '密码不能为空', trigger: 'blur' },
                ],
                nickname: [
                    { required: true, message: '昵称不能为空', trigger: 'blur' },
                ],
                rePassword: [
                    { required: true, message: '确认密码不能为空', trigger: 'blur' },
                ],
                captcha: [
                    { required: true, message: '验证码不能为空', trigger: 'blur' },
                ],
            },
            showRegHtml:false,
            regUserForm:{
                username:"",
                nickname:"",
                password:"",
                rePassword:"",
                username:"",
                captcha:"",
            },
            codeSrc:"/captcha",
		},
		methods: {
            //提交表单
            kefuLogin(formName){
                let _this=this;
                this.$refs[formName].validate((valid) => {
                    if (!valid) {
                        return false;
                    } else {
                        let data = {};
                        data.type="kefu";
                        data.username = _this.kefuForm.username;
                        data.password = _this.kefuForm.password;
                        data.google_code = _this.kefuForm.googleCode;
                        _this.loading = true;
                        $.post("/check", data, function (data) {
                            if (data.code == 200) {
                                _this.$message({
                                    message: data.msg,
                                    type: 'success'
                                });
                                localStorage.setItem("token",data.result.token);
                                localStorage.setItem("ref_token",data.result.ref_token);
                                localStorage.setItem("create_time",data.result.create_time);
                                window.location.href="/main";
                            } else if (data.code == 428) {
                                _this.googleBinding=data.result;
                                _this.kefuForm.googleCode="";
                                _this.$message({message:data.msg,type:'warning'});
                            } else {
                                _this.$message({
                                    message: data.msg,
                                    type: 'error'
                                });
                            }
                            _this.loading = false;
                        });
                    }
                });
			},
            //重置表单
            resetForm(formName) {
                this.loading=false;
                this.$refs[formName].resetFields();
            },
            //注册
            register(){
                var _this=this;
                this.$refs['regUserFormName'].validate((valid) => {
                        if (!valid) {
                            return false;
                        } else {
                            var data = {};
                            data.name=_this.regUserForm.username;
                            data.password = _this.regUserForm.password;
                            data.rePassword = _this.regUserForm.rePassword;
                            data.nickname=_this.regUserForm.nickname;
                            data.captcha=_this.regUserForm.captcha;
                            this.loading=true;
                            $.post("/register", data, function (data) {
                                if (data.code == 200) {
                                    _this.$message({
                                        message: data.msg,
                                        type: 'success'
                                    });
                                    window.location.href="/login";
                                } else {
                                    _this.$message({
                                        message: data.msg,
                                        type: 'error'
                                    });
                                }
                                _this.loading=false;
                            });
                        }
                });
            }
		},
        created: function () {
            if (top.location != location){
                top.location.href = location.href;
            }
        }
	})

</script>

{{.SystemKefu}}

</html>
