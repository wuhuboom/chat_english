{{define "nav"}}
<div class="mainLeftMenu">
    <div class="operatorCard">
        <el-dropdown   @command="changeOnlineStatus">
            <el-badge :type="onlineType" is-dot class="item">
                <el-avatar   class="mainLogo"  title="GOFLY客服多商户版" :size="45" :src="adminAvator"></el-avatar>
            </el-badge>
            <el-dropdown-menu slot="dropdown">
                <el-dropdown-item command="1">在线</el-dropdown-item>
                <el-dropdown-item  command="2">离线</el-dropdown-item>
            </el-dropdown-menu>
        </el-dropdown>
        <button type="button"
                class="operatorStatus operatorStatusButton"
                :class="socketHealthClass"
                :title="socketHealthTooltip"
                v-on:click.stop="reconnectSocket">
            <{socketHealthLabel}>
        </button>
    </div>
    <div class="menuLeftItem" :class="{'active':activeMenu==='home'}" title="首页" v-on:click="openIframeUrl('/mainGuide','home')">
        <i class="el-icon-house"></i>
        <span slot="title"><{flyLang.home}></span>
    </div>

    <div class="menuLeftItem" :class="{'active':activeMenu==='chat'}" title="对话" v-on:click="haveNewMessage='';openIframeUrl('/chat_main','chat')">
        <el-badge :value="haveNewMessage" class="item">
            <i class="el-icon-chat-dot-round"></i>
        </el-badge>
        <span slot="title"><{flyLang.chat}></span>
    </div>

    <div class="menuLeftItem notificationMenuItem"
         :class="{'notification-disabled': notificationPermission!=='granted'}"
         :title="notificationPermission==='granted' ? '桌面通知已开启' : '查看通知开启教程'"
         v-on:click="openNotificationGuide">
        <i class="el-icon-bell"></i>
        <span slot="title"><{notificationPermission==='granted' ? '通知已开' : '开启通知'}></span>
    </div>

    <div class="menuLeftItem" :class="{'active':activeMenu==='visitors'}" title="访客" v-show="menuAdminShow" v-on:click="openIframeUrl('/setting_visitor_list','visitors')">
        <i class="el-icon-user"></i>
        <span slot="title">访客</span>
    </div>
    <div class="menuLeftItem" :class="{'active':activeMenu==='deploy'}" title="对接" v-on:click="openIframeUrl('/setting_deploy','deploy')">
        <i class="el-icon-notebook-2"></i>
        <span slot="title">对接</span>
    </div>
    <div class="menuLeftItem" :class="{'active':activeMenu==='agents'}" title="用户管理" v-show="superShow"  v-on:click="openIframeUrl('/setting_kefu_list','agents')">
        <i class="el-icon-edit-outline"></i>
        <span slot="title"><{flyLang.agentList}></span>
    </div>

    <div class="menuLeftItem" :class="{'active':activeMenu==='settings'}" title="设置" v-show="menuAdminShow"  v-on:click="openIframeUrl('/setting_configs','settings')">
        <i class="el-icon-setting"></i>
        <span slot="title"><{flyLang.setting}></span>
    </div>

    <div class="menuLeftItem" :class="{'active':activeMenu==='cleanup'}" title="聊天记录清理" v-show="merchantShow" v-on:click="openIframeUrl('/setting_message_cleanup','cleanup')">
        <i class="el-icon-delete"></i>
        <span slot="title">清理</span>
    </div>

    <div class="menuLeftItem" :class="{'active':activeMenu==='logs'}" title="系统日志" v-show="superShow" v-on:click="openIframeUrl('/setting_logs','logs')">
        <i class="el-icon-document"></i>
        <span slot="title">日志</span>
    </div>

    <div class="menuLeftItem" :class="{'active':activeMenu==='welcome'}" title="欢迎语" v-on:click="openIframeUrl('/setting_welcome','welcome')">
        <i class="el-icon-timer"></i>
        <span slot="title">欢迎</span>
    </div>

    <div class="menuLeftItem" :class="{'active':activeMenu==='menu'}" title="全部菜单" v-on:click="openIframeUrl('/setting','menu')">
        <i class="el-icon-menu"></i>
        <span slot="title"><{flyLang.menu}></span>
    </div>

    <div  class="menuLeftItem menuLeftItemLogout" title="退出登录" v-on:click="logout()">
        <i class="el-icon-switch-button"></i>
        <span slot="title"><{flyLang.logout}></span>
    </div>

</div>

{{end}}
