{{template "header" }}
<div id="app" style="width:100%">
    <template>
        <el-container v-loading.fullscreen.lock="fullscreenLoading">

            <el-main class="mainMain">
                <el-card v-if="menuAdminShow || menuStoreShow" shadow="never" style="margin-bottom: 18px;">
                    <div slot="header">IP 白名单 · <{menuAdminShow ? '全局访客' : '本商户访客'}></div>
                    <el-form label-width="120px" :disabled="!visitorAllowlistLoaded || visitorAllowlistSaving">
                        <el-form-item label="启用白名单">
                            <el-switch v-model="visitorAllowlist.enabled"></el-switch>
                        </el-form-item>
                        <el-form-item label="单独 IP">
                            <el-input v-model="visitorAllowlistIPs" type="textarea" :rows="3"
                                      placeholder="每行填写一个 IPv4 或 IPv6 地址"></el-input>
                        </el-form-item>
                        <el-form-item label="允许地区">
                            <el-select v-model="visitorAllowlist.regions" multiple filterable clearable
                                       placeholder="请选择地区" style="width: 100%; max-width: 550px;">
                                <el-option v-for="region in visitorAllowlistRegions" :key="region.code"
                                           :label="region.label" :value="region.code"></el-option>
                            </el-select>
                        </el-form-item>
                        <el-form-item>
                            <el-button type="primary" @click="saveVisitorAllowlist">保存白名单</el-button>
                            <p>命中本规则的任意 IP 或地区即可通过。如果全局和本商户规则都已启用，访客须同时通过两套规则。</p>
                        </el-form-item>
                    </el-form>
                </el-card>
                <el-table
                        :data="ipblackList"
                        border
                        style="width: 100%">
                    <el-table-column
                            prop="ip"
                            label="IP地址">
                    </el-table-column>
                    <el-table-column
                            prop="name"
                            label="访客名称">
                    </el-table-column>
                    <el-table-column
                            prop="kefu_id"
                            label="添加客服">
                    </el-table-column>
                    <el-table-column
                            prop="create_at"
                            label="添加时间">
                    </el-table-column>
                    <el-table-column
                            prop="id"
                            label="操作">
                        <template slot-scope="scope">
                            <el-button @click="deleteIpblack(scope.row.ip)" type="danger" size="small" plain>解除黑名单</el-button>
                        </template>
                    </el-table-column>
                </el-table>
            </el-main>

        </el-container>
    </template>

</div>
</body>
{{template "setting_bottom" .}}
