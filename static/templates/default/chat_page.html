<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta name="system-timezone" content="{{.SystemTimezone}}">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" name="viewport" />
    <meta name="keywords" content="{{.SystemKeywords}}" />
    <meta name="description" content="{{.SystemDesc}}" />
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/element-ui/2.15.1/theme-chalk/index.min.css">
    <script src="/static/vue/2.6.11/vue.min.js"></script>
    <script src="/static/element-ui/2.15.1/index.js"></script>
    <script src="/static/jquery/3.6.0/jquery.min.js"></script>

    <script src="/static/js/functions.js?v=0.7.2"></script>
    <link rel="stylesheet" href="/static/css/front.css?v=0.6.0" />
    <link rel="stylesheet" href="/static/css/common.css?v=1.0.2" />
    <link rel="stylesheet" href="/static/css/icono.min.css" />
    <link rel="icon" href="/static/images/favicon.ico">
    <link rel="stylesheet" href="/static/css/chart-page.css?v=0.0.1" />
    <link rel="stylesheet" href="/static/css/visitor-modern.css?v=1.1.1" />
    {{if eq .H5ChatTemplate "chat_wx.html"}}
    <link rel="stylesheet" href="/static/css/chat-wx.css?v=1.0.0" />
    {{end}}
    <style>
        .el-message-box {
            width: auto;
            max-width: 100%;
            max-height: 100%;
            overflow: auto;
        }
    </style>
</head>

<body class="visitorChatBody{{if eq .H5ChatTemplate "chat_wx.html"}} visitorWechatSkin{{end}}">
    <div id="app" class="chatCenter">
        <template>
            <!--客服代码-->
            <div class="chatEntTitle" v-show="!isIframe">
                <button type="button" class="visitorHeaderBack" :title="flyLang.back" :aria-label="flyLang.back"
                    v-on:click="goBack">
                    <i class="el-icon-arrow-left"></i>
                </button>
                <el-badge :type="onlineType" is-dot class="item">
                    <el-avatar class="chatEntTitleLogo" :size="35" :src="noticeAvatar"></el-avatar>
                </el-badge>
                <span class="visitorHeaderTitle">
                    <{chatTitle}>
                </span>
            </div>
            <div class="chatEntBox">
                <div class="chatBoxNav">
                    <div class="back_btn" v-on:click="window.history.back()">
                        <i class="el-icon-back"></i>
                    </div>
                    <p>
                        <{getKefuName}>
                    </p>
                </div>
                <div ref="chatVisitorPage" class="chatContext chatVisitorPage"
                    v-on:click="showIconBtns=false;showFaceIcon=false">
                    <div class="chatBox">
                        <div style="cursor: pointer" class="chatTime" v-on:click="loadMoreMessages"
                            v-show="showLoadMore">
                            <{flyLang.moremessage}>
                        </div>

                        <el-row class="chatReplay" :gutter="2" v-show="replys.length>0">
                            <el-col :span="3"><el-avatar shape="square" :size="36"
                                    :src="noticeAvatar"></el-avatar></el-col>
                            <el-col :span="21">
                                <div class="chatUser">
                                    <{noticeName}>
                                </div>
                                <div class="chatContent visitorReply">
                                    <div v-for="reply in replys">
                                        <div class="visitorReplyTitle">
                                            <{reply.group_name}>
                                        </div>
                                        <div v-on:click="sendReply(item.item_name)" class="visitorReplyContent"
                                            v-for="item in reply.items">
                                            <{item.item_name}>
                                        </div>
                                    </div>
                                </div>
                            </el-col>
                            <div class="clear"></div>
                        </el-row>
                        <el-dialog :title="flyLang.leave" :visible.sync="allOffline" width="100%" top="0">
                            <el-input style="margin-bottom: 10px;" :placeholder="flyLang.email"
                                v-model="visitorContact.email"></el-input>
                            <el-input style="margin-bottom: 10px;" :placeholder="flyLang.wechat"
                                v-model="visitorContact.weixin"></el-input>
                            <el-input style="margin-bottom: 10px;" :placeholder="flyLang.realname"
                                v-model="visitorContact.name"></el-input>
                            <el-input :placeholder="flyLang.content" type="textarea"
                                v-model="visitorContact.msg"></el-input>
                            <span slot="footer" class="dialog-footer">
                                <el-button @click="sendEmailMsg">
                                    <{flyLang.sent}>
                                </el-button>
                                <el-button @click="allOffline = false">
                                    <{flyLang.cancel}>
                                </el-button>
                            </span>
                        </el-dialog>
                        <!--录音-->
                        <el-dialog :visible.sync="audioDialog" width="100%" top="0">
                            <div class="dialogRecoder">
                                <el-progress type="circle" :format="recoderFormat" :stroke-width="10"
                                    :percentage="recoderSecond"></el-progress>
                                <br />
                                <audio v-show="recorderEnd" controls ref="audio" muted="muted" src=""
                                    id="audio"></audio>
                                <br />
                                <el-button id="start" @click="startRecoder($event)">
                                    <{flyLang.start}>
                                </el-button>
                                <el-button @click="stopRecoder($event)">
                                    <{flyLang.stop}>
                                </el-button>
                                <el-button @click="sendRecoder()">
                                    <{flyLang.sent}>
                                </el-button>
                                <el-button @click="cancelRecoder()">
                                    <{flyLang.cancel}>
                                </el-button>
                            </div>

                        </el-dialog>
                        <!--//录音-->
                        <!--切换语言-->
                        <el-dialog :visible.sync="flagsDialog" width="90%" top="30px">
                            <!--                        <el-button @click="selectLang('cn')" class="flagBtn" type="primary" plain><img src="/static/images/flags/cn.svg"/> 中文</el-button>-->
                            <el-button @click="selectLang('en')" class="flagBtn" type="primary" plain><img
                                    src="/static/images/flags/gb.svg" /> english</el-button>
                            <!--                        <el-button @click="selectLang('jp')" class="flagBtn" type="primary" plain><img src="/static/images/flags/jp.svg"/> Japanese</el-button>-->
                        </el-dialog>
                        <!--//切换语言-->

                        <div class="visitorMessageRow"
                             v-for="v in msgList"
                             :key="v.msg_id || (v.time + '-' + v.content)"
                             v-bind:class="{'chatBoxMe': v.is_kefu==true}">
                            <div class="chatTime" v-bind:class="{'chatTimeHide': v.show_time==false}"><span>
                                    <{formatTime(v.time)}>
                                </span></div>
                            <div class="visitorMessageLine" v-if="v.is_kefu!=true">
                                <el-avatar class="visitorMessageAvatar" shape="square" :size="40"
                                        :src="v.avator"></el-avatar>
                                <div class="visitorMessagePayload">
                                    <div class="chatUser" v-if="showKefuName!='off'">
                                        <{v.name}>
                                    </div>
                                    <div class="chatContent replyContentBtn" v-html="v.content.replace(/\n/g, '<br/>')"></div>
                                </div>
                            </div>
                            <div class="visitorMessageLine visitorMessageMine" v-if="v.is_kefu==true">
                                <div class="visitorMessagePayload">
                                    <div class="chatContent replyContentBtn" v-html="v.content.replace(/\n/g, '<br/>')"></div>
                                    <div class="chatReadStatus">
                                        <{v.read_status}>
                                    </div>
                                </div>
                                {{if eq .H5ChatTemplate "chat_wx.html"}}
                                <el-avatar class="visitorMessageAvatar visitorMessageSelfAvatar" shape="square" :size="40"
                                        :src="v.avator"></el-avatar>
                                {{end}}
                            </div>
                        </div>

                        <!--知识库返回-->
                        <!--//知识库返回-->
                    </div>
                </div>
                <div class="chatBoxSend">
                    <div class="iconBtns visitorIconBox" v-show="showIconBtns">
                        <div style="display: none" :title="flyLang.emotions"
                            class="icono-smile visitorIconBtns visitorFaceBtn"></div>
                        <div :title="flyLang.photo" :aria-label="flyLang.photo" role="button" tabindex="0"
                            class="icono-image visitorIconBtns visitorImageBtn" id="uploadImg"
                            v-bind:class="{'is-uploading': imageUploading}"
                            v-on:click="uploadImg('/uploadimg')"
                            v-on:keyup.enter="uploadImg('/uploadimg')"></div>
                        <div :title="flyLang.file" class="icono-folder visitorIconBtns visitorFolderBtn" id="uploadFile"
                            v-on:click="uploadFile('/uploadfile')"></div>
                        <!--                    <div :title="flyLang.recoder" class="icono-microphone visitorIconBtns visitorHistoryBtn"  v-on:click="audioDialog=true"></div>-->
                        <!--                    <div :title="flyLang.newWindow" class="icono-display visitorIconBtns visitorHistoryBtn"  v-on:click="openNewWindow()"></div>-->
                        <!--                    <div style="display:none;" class="audioIcon visitorIconBtns visitorAudioIcon"  @click="callPeer" ></div>-->
                        <!--                    <div class="icono-support visitorIconBtns" @click="flagsDialog='true'"> </div>-->
                        <div class="clear"></div>
                    </div>
                    <input ref="imageInput" class="visitorHiddenFileInput" type="file" tabindex="-1" aria-hidden="true"
                        accept="image/jpeg,image/png,image/gif,image/webp,.jpg,.jpeg,.png,.gif,.webp"
                        v-on:change="handleImageSelected">
                    <div class="visitorUploadStatus" v-if="imageUploading" role="status" aria-live="polite">
                        <i class="el-icon-loading"></i>
                        <span><{uploadCopy.uploading}> <{imageUploadProgress}>%</span>
                    </div>
                    <div class="faceBox visitorFaceBox modernEmojiPicker" v-show="showFaceIcon"
                        v-on:click.stop>
                        <div class="emojiPickerHeader">
                            <span class="emojiPickerTitle">Emoji</span>
                            <span class="emojiPickerHint"><{activeEmojiGroupName}></span>
                        </div>
                        <div class="emojiPickerGrid">
                            <button type="button" class="emojiPickerItem"
                                v-for="emoji in visibleEmojis" :key="emoji"
                                :title="emoji" :aria-label="emojiTexts.insert + ' ' + emoji"
                                v-on:click.stop="selectEmoji(emoji)">
                                <span><{emoji}></span>
                            </button>
                        </div>
                        <div class="emojiPickerTabs" role="tablist" :aria-label="emojiTexts.categories">
                            <button type="button" class="emojiPickerTab"
                                v-if="recentEmojis.length"
                                :class="{'is-active': activeEmojiGroup === 'recent'}"
                                :title="emojiTexts.recent" :aria-label="emojiTexts.recent"
                                v-on:click.stop="activeEmojiGroup='recent'">
                                🕘
                            </button>
                            <button type="button" class="emojiPickerTab"
                                v-for="group in emojiGroups" :key="group.id"
                                :class="{'is-active': activeEmojiGroup === group.id}"
                                :title="group.name" :aria-label="group.name"
                                v-on:click.stop="activeEmojiGroup=group.id">
                                <{group.icon}>
                            </button>
                        </div>
                    </div>
                    <div class="visitorEditor">
                        <el-input class="visitorEditorArea" @focus="textareaFocus;showIconBtns=false"
                            @blur="textareaBlur;showIconBtns=false" v-model="messageContent"
                            @keyup.native="inputNextText" v-on:keyup.enter.native="chatToUser"
                            :placeholder="flyLang.textarea">
                        </el-input>
                        <div :title="flyLang.emotions"
                            v-on:click.stop="toggleEmojiPicker"
                            class="visitorEditorSmile visitorFaceBtn"></div>
                        <div v-on:click="showIconBtns==true?showIconBtns=false:showIconBtns=true"
                            v-show="messageContent==''" :title="flyLang.emotions" class="visitorEditorChoose"></div>
                        <el-button type="primary" size="small" v-show="!sendDisabled && messageContent!=''"
                            class="visitorEditorBtn" :disabled="sendDisabled||messageContent==''"
                            v-on:click="chatToUser();showIconBtns=false">
                            <{flyLang.sent}>
                        </el-button>
                    </div>

                    <div class="footContact clear">
                        <a href="{{.CopyrightUrl}}" target="_blank">{{.CopyrightTxt}}</a>
                    </div>
                </div>
            </div>
            <div class="chatArticle">
                <div class="companyInfo">
                    <div class="companyAvatarWrap">
                        <el-avatar shape="square" :size="104" :src="noticeAvatar"></el-avatar>
                        <span class="companyOnlineDot"></span>
                    </div>
                    <p class="companyName">
                        <{noticeName}>
                    </p>
                    <div class="companyRole"><{flyLang.onlineService}></div>
                    <div class="companyResponse"><{flyLang.replyInMinutes}></div>
                </div>
                <div class="quickReplyPanel" v-show="replys.length>0">
                    <div class="quickReplyHeading"><{flyLang.suggestedQuestions}></div>
                </div>
                <div class="quickReplyGroup" v-for="reply in replys">
                    <a v-on:click="sendReply(item.item_name)" class="chatArticleItem" v-for="item in reply.items">
                        <{item.item_name}>
                    </a>
                </div>
            </div>
            <div class="clear"></div>

            <!--//客服代码-->
            <audio id="chatMessageAudio">
                <source id="chatMessageAudioSource" />
            </audio>
            <audio id="chatMessageSendAudio">
                <source id="chatMessageSendAudioSource" />
            </audio>
            <video id="chatRtc" style="display: none"></video>
            <!--重连按钮-->
            <el-dialog :visible.sync="reconnectDialog" :close-on-click-modal="false" width="90%" :show-close="false"
                top="50px" center>
                <span><i style="font-size: 20px;" class="el-icon-warning-outline"></i>
                    <{chatTitle}>
                </span>
                <span slot="footer" class="dialog-footer">
                    <el-button @click="focusHandle" type="primary" plain><{flyLang.reconnect}></el-button>
                </span>
            </el-dialog>
            <!--//重连按钮-->
            <!--图片预览-->

            <el-image style="display: none;" ref="preview" class="hideImgDiv" :src="imgPreviewSrc[0]"
                :preview-src-list="imgPreviewSrc" z-index="9999"></el-image>






        </template>
    </div>
</body>
<script src="/static/js/reconnecting-websocket.min.js"></script>
<script src="/static/js/recoder.js"></script>
<script>
    var KEFU_ID = '{{.KEFU_ID}}';
    var REFER = '{{.Refer}}';
    var ENT_ID = '{{.ENT_ID}}';
    var IS_TRY = '{{.IS_TRY}}';
    var VISITOR_ID = '{{.visitorId}}';
    var VISITOR_NAME = '{{.visitorName}}';
    var ERR_MSG = '{{.errMsg}}';
    var AVATOR = '{{.avator}}';
    var LANG = checkLang();
    var SHOW_KEFU_NAME = '{{.ShowKefuName}}'
</script>
<script src="/static/js/chat-lang.js?v=0.5.2"></script>
<script src="/static/js/chat-config.js?v=0.5.1"></script>
<script>

    new Vue({
        el: '#app',
        delimiters: ["<{", "}>"],
        data: {
            window: window,
            server: getWsBaseUrl() + "/ws_visitor",
            socket: null,
            msgList: [],
            imgPreviewSrc: [
                ""],
            msgListNum: [],
            messageContent: "",
            chatTitle: GOFLY_LANG[LANG]['connecting'],
            visitor: {},
            face: [],
            emojiGroups: getModernEmojiGroups(LANG),
            emojiTexts: getEmojiPickerTexts(LANG),
            activeEmojiGroup: "smileys",
            recentEmojis: [],
            showKfonline: false,
            socketClosed: false,
            focusSendConn: false,
            wsSocketClosed: true,
            timer: null,
            loadingTimer: null,
            sendDisabled: false,
            entLogo: "",
            entName: "",
            peer: null,
            peerjsId: "",
            kefuPeerId: "",
            loading: null,
            localStream: null,
            flyLang: GOFLY_LANG[LANG],
            lang: LANG,
            textareaFocused: false,
            imageUploading: false,
            imageUploadProgress: 0,
            replys: [],
            noticeName: "",
            noticeAvatar: "",
            allOffline: false,
            visitorContact: {
                email: "",
                weixin: "",
                name: "",
                msg: "",
            },
            haveUnreadMessage: false,
            audioDialog: false,
            flagsDialog: false,
            recorder: null,
            recorderAudio: null,
            recordeTimer: null,
            recoderSecond: 0,
            currentActiveTime: Date.now(),
            timeoutTimer: null,
            timeoutLongTime: 20 * 60 * 1000,//20分钟没反应
            allTimeouter: [],
            currentPage: 1,
            showLoadMore: false,
            loadMoreDisable: false,
            websocketOpenNum: 0,//websocket打开次数
            websocketMaxOpenNum: 10,//websocket最大打开次数
            talkBtnText: GOFLY_LANG[LANG]['holdToTalk'],
            recorderEnd: false,
            isMobile: false,
            isIframe: false,
            onlineType: "success",
            reconnectDialog: false,
            showIconBtns: false,
            showFaceIcon: false,
            showKefuName: SHOW_KEFU_NAME,
        },
        methods: {
            goBack: function () {
                if (window.history.length > 1) {
                    window.history.back();
                    return;
                }
                window.location.href = "/";
            },
            //初始化websocket
            initConn: function () {
                this.socket = new ReconnectingWebSocket(this.server + "?visitor_id=" + this.visitor.visitor_id + "&to_id=" + this.visitor.to_id);//创建Socket实例
                this.socket.debug = true;
                this.socket.onmessage = this.OnMessage;
                this.socket.onopen = this.OnOpen;
                this.socket.onerror = this.OnError;
                this.socket.onclose = this.OnClose;
            },
            OnOpen: function () {
                console.log("ws:onopen");
                //限制最大打开次数
                if (this.websocketOpenNum >= this.websocketMaxOpenNum) {
                    this.chatTitle = GOFLY_LANG[LANG]['refresh'];
                    this.socket.close();
                    return;
                }
                this.websocketOpenNum++;

                this.chatTitle = this.noticeName + " , " + GOFLY_LANG[LANG]['connectok'];
                this.checkTimeout();
                this.socketClosed = false;
                this.focusSendConn = false;
                this.wsSocketClosed = false;
                this.sendVisitorLogin();
                this.getExtendInfo();
                syncUnreadVisitorMessages(this);
                this.reconnectDialog = false;
            },
            OnMessage: function (e) {
                console.log("ws:onmessage");
                this.socketClosed = false;
                this.focusSendConn = false;
                const redata = JSON.parse(e.data);
                if (redata.type == "kfOnline") {
                    let msg = redata.data
                    if (this.showKfonline && this.visitor.to_id == msg.id) {
                        return;
                    }
                    this.visitor.to_id = msg.id;
                    this.chatTitle = msg.name + "," + GOFLY_LANG[LANG]['chating'];
                    $(".chatBox").append("<div class=\"chatTime\">" + this.chatTitle + "</div>");
                    this.scrollBottom();
                    this.showKfonline = true;
                }
                if (redata.type == "transfer") {
                    var kefuId = redata.data
                    if (!kefuId) {
                        return;
                    }
                    this.visitor.to_id = kefuId;
                }
                if (redata.type == "notice") {
                    let msg = redata.data
                    if (!msg) {
                        return;
                    }
                    this.chatTitle = msg
                    $(".chatBox").append("<div class=\"chatTime\">" + this.chatTitle + "</div>");
                    this.scrollBottom();
                }
                if (redata.type == "peerid") {
                    let msg = redata.data;
                    if (!msg) {
                        return;
                    }
                    this.kefuPeerId = msg;
                    this.talkPeer();
                }
                if (redata.type == "delete") {
                    var msg = redata.data;
                    for (var i = 0; i < this.msgList.length; i++) {
                        if (this.msgList[i].msg_id == msg.msg_id) {
                            this.msgList[i].content = GOFLY_LANG[LANG]['messageDeleted'];
                            this.msgList.splice(i, 1);
                            //break;
                        }
                    }
                }
                if (redata.type == "read") {
                    var msg = redata.data;
                    for (var i = 0; i < this.msgList.length; i++) {
                        this.msgList[i].read_status = GOFLY_LANG[LANG]['read'];
                    }
                }
                if (redata.type == "message") {
                    let msg = redata.data
                    if (hasVisitorChatMessageID(this, msg.msg_id)) {
                        return;
                    }
                    //this.visitor.to_id=msg.id;
                    var _this = this;

                    var msgArr = msg.content.split("[br]");
                    for (var i in msgArr) {
                        let content = {}
                        content.avator = msg.avator;
                        content.name = msg.name;
                        content.content = replaceSpecialTag(msgArr[i]);
                        content.is_kefu = false;
                        content.read_status = GOFLY_LANG[LANG].unread;
                        content.time = msg.time;
                        content.is_reply = true;
                        content.msg_id = msg.msg_id;
                        this.msgList.push(content);
                        setTimeout(function () {
                            _this.scrollBottom();
                        }, 200);
                    }

                    // let content = {}
                    // content.avator = msg.avator;
                    // content.name = msg.name;
                    // content.content =replaceSpecialTag(msg.content);
                    // content.is_kefu = false;
                    // content.time = msg.time;
                    // content.msg_id = msg.msg_id;
                    // this.msgList.push(content);

                    notify(msg.name, {
                        body: msg.content,
                        icon: msg.avator
                    }, function (notification) {
                        window.focus();
                        notification.close();
                    });
                    //this.scrollBottom();
                    flashTitle();//标题闪烁
                    //clearInterval(this.timer);
                    this.cleanAllTimeout();
                    this.alertSound('/static/images/alert4.mp3');//提示音
                    this.haveUnreadMessage = true;
                }
                if (redata.type == "close") {
                    this.showTitle(GOFLY_LANG[LANG]['closemes']);
                    this.scrollBottom();
                    this.socket.close();
                    //this.socketClosed=true;
                    this.focusSendConn = true;
                    this.reconnectDialog = true;
                }
                if (redata.type == "force_close") {
                    this.showTitle(GOFLY_LANG[LANG]['forceclosemes']);
                    this.scrollBottom();
                    this.socket.close();
                    this.socketClosed = true;
                    this.reconnectDialog = true;
                }
                if (redata.type == "auto_close") {
                    this.showTitle(GOFLY_LANG[LANG]['autoclosemes']);
                    this.scrollBottom();
                    this.socket.close();
                    this.socketClosed = true;
                    this.reconnectDialog = true;
                }
                if (redata.type == "change_id") {
                    let msg = redata.data;
                    var openId = msg.to;
                    var visitor = this.getCache("visitor_" + ENT_ID);
                    visitor.visitor_id = openId;
                    this.setCache("visitor_" + ENT_ID, visitor);
                    location.reload();
                }
                window.parent.postMessage(redata, "*");
            },
            //发送给客户
            chatToUser: function () {
                if (this.sendDisabled) {
                    return;
                }
                var messageContent = this.messageContent.trim("\r\n");
                messageContent = messageContent.replace("\n", "");
                messageContent = messageContent.replace("\r\n", "");
                if (messageContent == "" || messageContent == "\r\n") {
                    this.messageContent = "";
                    return;
                }
                this.messageContent = messageContent;
                this.currentActiveTime = Date.now();
                if (this.socketClosed) {
                    this.initConn();
                    // this.$message({
                    //     message: '连接关闭!请重新打开页面',
                    //     type: 'warning'
                    // });
                    //return;
                }
                this.sendDisabled = true;
                let _this = this;

                let content = {}
                content.avator = _this.visitor.avator;
                content.content = replaceContent(_this.messageContent);
                content.name = _this.visitor.name;
                content.is_kefu = true;
                content.read_status = GOFLY_LANG[LANG]['unread'];
                content.time = _this.getNowDate();
                content.show_time = false;
                _this.msgList.push(content);
                _this.scrollBottom();

                let mes = {};
                mes.type = "visitor";
                mes.content = this.messageContent;
                mes.from_id = this.visitor.visitor_id;
                mes.to_id = this.visitor.to_id;
                mes.content = this.messageContent;
                //发送消息
                $.post("/2/message?lang=" + getQuery("lang"), mes, function (res) {
                    _this.sendDisabled = false;

                                    _this.imageUploadProgress = Math.round(progressEvent.loaded * 100 / progressEvent.total);

                            });

            showTitle: function (title) {
                this.chatTitle = title;
                $(".chatBox").append("<div class=\"chatTime\"><span>" + title + "</span></div>");
                this.scrollBottom();
            },
            //开始录音
            startRecoder: function (e) {
                if (this.recorder) {
                    this.recorder.destroy();
                    this.recorder = null;
                }
                var _this = this;
                Recorder.getPermission().then(function () {
                    _this.recorder = new Recorder();
                    _this.recorderAudio = document.querySelector('#audio');
                    _this.recorder.start();
                    _this.recorder.onprogress = function (params) {
                        _this.recoderSecond = parseInt(params.duration);
                    }
                    _this.talkBtnText = _this.flyLang.releaseToStop;
                }, function (error) {
                    _this.$message({
                        message: _this.flyLang.recordingPermission,
                        type: 'error'
                    });
                    return;
                });
                e.preventDefault();
            },
            stopRecoder: function (e) {
                if (!this.recorder) {
                    return;
                }
                var blob = this.recorder.getWAVBlob();
                this.recorderAudio.src = URL.createObjectURL(blob);
                this.recorderAudio.controls = true;
                this.talkBtnText = this.flyLang.holdToTalk;
                this.recorderEnd = true;
                e.preventDefault();
            },
            sendRecoder: function () {
                if (!this.recorder) {
                    return;
                }

                var blob = this.recorder.getWAVBlob();
                var formdata = new FormData(); // form 表单 {key:value}
                formdata.append("realfile", blob); // form input type="file"
                var _this = this;
                this.loading = this.$loading({
                    lock: true,
                    text: this.flyLang.sending,
                    spinner: 'el-icon-loading',
                    background: 'rgba(0, 0, 0, 0.7)'
                });
                $.ajax({
                    url: "/uploadaudio",
                    type: 'post',
                    processData: false,
                    contentType: false,
                    data: formdata,
                    dataType: 'JSON',
                    mimeType: "multipart/form-data",
                    success: function (res) {
                        _this.loading.close();
                        if (res.code != 200) {
                            _this.$message({
                                message: res.msg,
                                type: 'error'
                            });
                        } else {
                            _this.cancelRecoder();
                            _this.messageContent += 'audio[/' + res.result.path + ']';
                            _this.chatToUser();
                        }
                    }
                })

            },
            cancelRecoder: function () {
                this.audioDialog = false;
                if (!this.recorder) {
                    return;
                }
                this.recorder.destroy();
                this.recorder = null;
                this.recoderSecond = 0;
            },
            recoderFormat: function (percentage) {
                return percentage + "s";
            },
            openNewWindow: function () {
                var features = "height=580, width=400, top=10, left=500, toolbar=no, menubar=no,scrollbars=no,resizable=no, location=no, status=no";  //设置新窗口的特性
                var me = window.open(location.href, "newW", features);
            },
            //超时关闭
            checkTimeout: function () {
                var _this = this;
                this.timeoutTimer = setInterval(function () {
                    if (Date.now() - _this.currentActiveTime >= _this.timeoutLongTime) {
                        console.log("长时间无操作");
                        if (_this.socket != null) {
                            _this.reconnectDialog = true;
                            _this.showTitle(GOFLY_LANG[LANG]['autoclosemes']);
                            _this.socket.close();
                            _this.socket = null;
                        }
                    }
                }, 55000);
            },
            closeTimeoutTimer: function () {
                clearInterval(this.timeoutTimer);
            },
            cleanAllTimeout: function () {
                for (var i in this.allTimeouter) {
                    clearTimeout(this.allTimeouter[i]);
                }
            },
            loadMoreMessages: function () {
                var _this = this;
                var pagesize = 5;
                // if(this.currentPage>1){
                //     this.replys=[];
                // }
                if (_this.loadMoreDisable) {
                    return;
                }
                var moreMessage = GOFLY_LANG[LANG]['moremessage'];
                this.flyLang.moremessage = this.flyLang.loading;
                this.loadMoreDisable = true;
                var hasUnread = false;
                this.sendAjax("/2/messages_page", "get", { pagesize: pagesize, ent_id: ENT_ID, page: this.currentPage, visitor_id: _this.visitor.visitor_id }, function (result) {
                    var len = result.list.length;
                    if (result.list.length != 0) {
                        if (len < pagesize) {
                            _this.showLoadMore = false;
                        } else {
                            _this.showLoadMore = true;
                        }

                        let msgList = result.list;
                        for (var i = 0; i < msgList.length; i++) {
                            let visitorMes = msgList[i];
                            let content = {}
                            if (visitorMes["mes_type"] == "kefu") {
                                content.is_kefu = false;
                                content.content = replaceSpecialTag(visitorMes["content"]);
                            } else {
                                content.is_kefu = true;
                                content.content = replaceContent(visitorMes["content"]);
                            }
                            if (visitorMes["read_status"] == "read") {
                                content.read_status = GOFLY_LANG[LANG].read;
                            } else {
                                content.read_status = GOFLY_LANG[LANG].unread;
                                if (i == 0) {
                                    hasUnread = true;
                                    _this.haveUnreadMessage = true;
                                }
                            }
                            content.avator = visitorMes["avator"];
                            content.name = visitorMes["name"];
                            content.msg_id = visitorMes["msg_id"];
                            content.time = visitorMes["time"];
                            insertVisitorChatMessageByID(_this, content);
                            //_this.scrollBottom();
                        }
                    } else {
                        _this.showLoadMore = false;
                    }
                    if (_this.currentPage == 1) {
                        _this.showWechatTip();
                        _this.scrollBottom();
                    }

                    _this.getNotice();
                    _this.currentPage++;
                    _this.flyLang.moremessage = moreMessage;
                    _this.loadMoreDisable = false;
                });
            },
            showWechatTip: function () {
                if (!GOFLY_CONFIG.SHOW_WECHAT) {
                    return;
                }
                var child = '<div class="wechatTip">';
                child += '<img style="width:80px; margin:10px;" src="' + GOFLY_CONFIG.WECHAT_QR_URL + '?snow_id=' + this.visitor.visitor_id + '&id_type=visitor">';
                child += this.flyLang.wechatQrTip + '</div>';
                $(".chatBox").append(child);
            },
            //格式化时间
            formatTime: function (time) {
                // var timeDate=new Date(time);
                // var timeStamp = Math.round(timeDate.getTime()/1000);
                // var nowTime=Math.round(new Date(new Date().toLocaleDateString()).getTime()/1000);
                // var timeDiff=timeStamp-nowTime;
                // if(timeDiff>=0){
                //     return dateFormat("H:M:S",timeDate);
                //     //return beautifyTime(timeStamp,LANG);
                // }else{
                //     return dateFormat("Y-m-d H:M:S",timeDate);
                // }
                return time;
            },
            getVersion: function () {
                if (IS_TRY == "false") {
                    return;
                }
                this.$alert(this.flyLang.trialWarning, this.flyLang.warning, {
                    confirmButtonText: this.flyLang.confirm,
                });
            },
            selectLang: function (lang) {
                var url = changeURLPar(document.URL, "lang", lang);
                document.location.href = url;
            },
            //focus事件处理
            focusHandle() {
                clearFlashTitle();
                window.location.reload();
            }
        },
        mounted: function () {
            var _this = this;
            this.syncVisualViewport();
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', this.syncVisualViewport);
                window.visualViewport.addEventListener('scroll', this.syncVisualViewport);
            }
            window.addEventListener('resize', this.syncVisualViewport);
            window.addEventListener('orientationchange', this.syncVisualViewport);
            document.addEventListener('paste', this.onPasteUpload);
            document.addEventListener('scroll', this.textareaBlur);
            window.addEventListener('message', function (e) {
                var msg = e.data;
                if (msg.type == "inputing_message") {
                    _this.sendInputingStrNow(msg.content);
                }
                if (msg.type == "send_message") {
                    _this.messageContent = msg.content;
                    _this.chatToUser();
                }
            });
        },
        beforeDestroy: function () {
            if (window.visualViewport) {
                window.visualViewport.removeEventListener('resize', this.syncVisualViewport);
                window.visualViewport.removeEventListener('scroll', this.syncVisualViewport);
            }
            window.removeEventListener('resize', this.syncVisualViewport);
            window.removeEventListener('orientationchange', this.syncVisualViewport);
            document.removeEventListener('paste', this.onPasteUpload);
            document.removeEventListener('scroll', this.textareaBlur);
            document.documentElement.style.removeProperty('--visitor-viewport-height');
            document.documentElement.style.removeProperty('--visitor-viewport-offset-top');
        },
        created: function () {
            this.loadRecentEmojis();
            this.init();
            this.getUserInfo();
            //加载历史记录
            //this.msgList=this.getHistory();
            //滚动底部
            //this.scrollBottom();
            //获取欢迎
            //this.initPeerjs();

            this.getAutoReply();
            //this.getVersion();
        },
        computed: {
            uploadCopy() {
                var copies = {
                    cn: {uploading: '图片上传中', invalid: '请选择 JPG、PNG、GIF 或 WebP 图片', failed: '图片上传失败，请重试'},
                    en: {uploading: 'Uploading image', invalid: 'Choose a JPG, PNG, GIF, or WebP image', failed: 'Image upload failed. Please try again.'},
                    jp: {uploading: '画像をアップロード中', invalid: 'JPG、PNG、GIF、WebP画像を選択してください', failed: '画像のアップロードに失敗しました'}
                };
                return copies[this.lang] || copies.en;
            },
            visibleEmojis() {
                if (this.activeEmojiGroup === "recent") {
                    return this.recentEmojis;
                }
                var currentGroup = this.emojiGroups.find(function (group) {
                    return group.id === this.activeEmojiGroup;
                }, this);
                return currentGroup ? currentGroup.emojis : [];
            },
            activeEmojiGroupName() {
                if (this.activeEmojiGroup === "recent") {
                    return this.emojiTexts.recent;
                }
                var currentGroup = this.emojiGroups.find(function (group) {
                    return group.id === this.activeEmojiGroup;
                }, this);
                return currentGroup ? currentGroup.name : this.emojiTexts.fallback;
            },
            getKefuName() {
                let name = ""
                for (let index = 0; index < this.msgList.length; index++) {
                    const el = this.msgList[index];
                    if (el.is_kefu != true) {
                        name = el.name
                        break
                    }

                }
                return name || 'Online service'
            },
        }
    })

</script>
