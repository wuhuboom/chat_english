{{template "header" }}
<style>
    .professional-avatar-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(72px, 1fr));
        gap: 12px;
        max-width: 560px;
    }
    .professional-avatar-option {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px 6px;
        border: 2px solid transparent;
        border-radius: 10px;
        background: #f5f7fa;
        color: #606266;
        cursor: pointer;
        transition: border-color .2s, background-color .2s, box-shadow .2s;
    }
    .professional-avatar-option:hover {
        border-color: #a0cfff;
        background: #ecf5ff;
    }
    .professional-avatar-option.is-selected {
        border-color: #409eff;
        background: #ecf5ff;
        box-shadow: 0 0 0 2px rgba(64, 158, 255, .12);
    }
    .professional-avatar-option img {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
    }
    .professional-avatar-option span {
        font-size: 12px;
        line-height: 1;
    }
    @media (max-width: 900px) {
        .professional-avatar-grid {
            grid-template-columns: repeat(3, minmax(72px, 1fr));
        }
    }
</style>
<div id="app" style="width:100%">
    <template>
        <el-container v-loading.fullscreen.lock="fullscreenLoading">

            <el-main class="mainMain">
                <el-button style="margin-bottom: 10px;" @click="addKefu" type="primary" size="small"><{flyLang.newUser}></el-button>

                <el-form :inline="true" :model="kefuSearch" class="demo-form-inline">
                    <el-form-item label="客服名称">
                        <el-input v-model="kefuSearch.name"></el-input>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" @click="kefuListOwnPage(1)"  icon="el-icon-search" ></el-button>
                    </el-form-item>
                </el-form>
                <el-table
                        :data="kefuList.list"
                        border
                        style="width: 100%;">
                    <el-table-column
                            prop="id"
                            label="ID">
                    </el-table-column>
                    <el-table-column
                            prop="pid"
                            label="PID">
                    </el-table-column>
                    <el-table-column
                            prop="img"
                            label="用户头像">
                        <template slot-scope="scope">
                            <el-avatar :size="50"><img :src="scope.row.avator"/></el-avatar>
                        </template>
                    </el-table-column>
                    <el-table-column

                            prop="name"
                            label="用户账号">
                    </el-table-column>
                    <el-table-column
                            prop="nickname"
                            label="用户昵称">
                        <template slot-scope="scope">

                            <a v-show="scope.row.role_id<3" v-on:click="copyText(host+'/chatIndex?ent_id='+scope.row.id+'&kefu_id='+scope.row.name)"><{scope.row.nickname}></a>
                            <span v-show="scope.row.role_id==3"><{scope.row.nickname}></span>
                        </template>
                    </el-table-column>
                    <el-table-column
                            prop="role_name"
                            label="用户角色">
                    </el-table-column>
                    <el-table-column
                            prop="created_at"
                            label="添加时间">
                    </el-table-column>
                    <el-table-column
                            prop="updated_at"
                            label="更新时间">
                    </el-table-column>
                    <el-table-column
                            prop="agent_num"
                            label="子账号上限">
                    </el-table-column>
                    <el-table-column
                            prop="status"
                            label="状态">
                        <template slot-scope="scope">
                            <el-switch
                                    v-model="scope.row.status"
                                    active-color="#13ce66"
                                    inactive-color="#ff4949"
                                    @change="switchUserStatus(scope.row.status,scope.row.id)"
                            >
                            </el-switch>
                        </template>
                    </el-table-column>

                    <el-table-column
                            width="250px;"
                            prop="id"
                            label="操作">
                        <template slot-scope="scope">
                            <el-button @click="kefuMessageDialog=true;kefuIdMessage=scope.row.id" type="primary" size="small" icon="el-icon-message" circle></el-button>
                            <el-button @click="getKefu(scope.row.id)" type="primary" size="small" icon="el-icon-edit" circle></el-button>
                            <el-button @click="deleteKefu(scope.row.id)" type="danger" size="small" icon="el-icon-delete" circle></el-button>
                        </template>
                    </el-table-column>
                </el-table>
                <el-pagination
                        background
                        @current-change="kefuListOwnPage"
                        :current-page="kefuList.page"
                        layout="prev,pager, next"
                        :page-size="kefuList.pagesize"
                        :total="kefuList.count">
                </el-pagination>
            </el-main>

        </el-container>
        <el-dialog
                :visible.sync="kefuMessageDialog"
                width="90%"
                top="0"
        >
            <iframe :src="'/setting_kefu_message?page=1&id='+kefuIdMessage" frameborder="0" width="100%" height="600px"></iframe>
            <span slot="footer" class="dialog-footer">
                <el-button @click="kefuMessageDialog = false">取 消</el-button>
                <el-button type="primary" @click="kefuMessageDialog = false">确 定</el-button>
            </span>
        </el-dialog>
        <el-dialog
                title="用户管理"
                :visible.sync="kefuDialog"
                width="50%"
                top="0"
                >
            <el-form ref="kefuForm" :model="kefuForm" :rules="rules" label-width="120px">
                <el-form-item label="用户名"  prop="name">
                    <el-input v-model="kefuForm.name"></el-input>
                </el-form-item>
                <el-form-item label="密码"  prop="password">
                    <el-input v-model="kefuForm.password"></el-input>
                </el-form-item>
                <el-form-item label="昵称"  prop="nickname">
                    <el-input v-model="kefuForm.nickname"></el-input>
                </el-form-item>
                <el-form-item label="头像"  prop="avator">
                    <div class="professional-avatar-grid">
                        <button
                                v-for="item in [
                                    {name:'女客服 1', file:'professional-woman-01.jpg'},
                                    {name:'女客服 2', file:'professional-woman-02.jpg'},
                                    {name:'女客服 3', file:'professional-woman-03.jpg'},
                                    {name:'女客服 4', file:'professional-woman-04.jpg'},
                                    {name:'女客服 5', file:'professional-woman-05.jpg'},
                                    {name:'男客服 1', file:'professional-man-01.jpg'},
                                    {name:'男客服 2', file:'professional-man-02.jpg'},
                                    {name:'男客服 3', file:'professional-man-03.jpg'},
                                    {name:'男客服 4', file:'professional-man-04.jpg'},
                                    {name:'男客服 5', file:'professional-man-05.jpg'},
                                    {name:'中式女客服 1', file:'chinese-woman-01.jpg'},
                                    {name:'中式女客服 2', file:'chinese-woman-02.jpg'},
                                    {name:'中式女客服 3', file:'chinese-woman-03.jpg'},
                                    {name:'中式女客服 4', file:'chinese-woman-04.jpg'},
                                    {name:'中式女客服 5', file:'chinese-woman-05.jpg'},
                                    {name:'中式男客服 1', file:'chinese-man-01.jpg'},
                                    {name:'中式男客服 2', file:'chinese-man-02.jpg'},
                                    {name:'中式男客服 3', file:'chinese-man-03.jpg'},
                                    {name:'中式男客服 4', file:'chinese-man-04.jpg'},
                                    {name:'中式男客服 5', file:'chinese-man-05.jpg'}
                                ]"
                                :key="item.file"
                                type="button"
                                class="professional-avatar-option"
                                :class="{'is-selected': kefuForm.avator === '/static/images/support-avatars/' + item.file}"
                                :aria-pressed="kefuForm.avator === '/static/images/support-avatars/' + item.file"
                                @click="kefuForm.avator = '/static/images/support-avatars/' + item.file">
                            <img :src="'/static/images/support-avatars/' + item.file" :alt="item.name">
                            <span><{item.name}></span>
                        </button>
                    </div>
                </el-form-item>
                <el-form-item label="角色"  prop="role_id">
                    <el-select v-model="kefuForm.role_id" placeholder="请选择角色">
                        <el-option :label="item.role_name" :value="item.role_id" v-for="item in roleList" v-bind:key="item.role_id">
                        </el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="子账号上限"  prop="agent_num">
                    <el-input v-model="kefuForm.agent_num"></el-input>
                </el-form-item>
            </el-form>
            <span slot="footer" class="dialog-footer">
                <el-button @click="kefuDialog = false"><{flyLang.cancel}></el-button>
                <el-button type="primary" @click="submitKefuForm('kefuForm')"><{flyLang.save}></el-button>
              </span>
        </el-dialog>
    </template>

</div>
</body>
{{template "setting_bottom" .}}
