# Install this file under nginx/conf.d after replacing the server_name.
# The map directive must stay in the nginx http context; conf.d is normally
# included from that context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream gofly_backend {
    server 127.0.0.1:8081;
    keepalive 64;
}

server {
    listen 80;
    server_name chat.example.com;

    client_max_body_size 32m;

    location / {
        proxy_pass http://gofly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Must exceed the application's 75-second Pong deadline. Five minutes
        # tolerates browser timer throttling while protocol Ping/Pong remains
        # active.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
}
